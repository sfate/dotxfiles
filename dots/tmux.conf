###########################
#  Configuration
###########################
# set zsh as default shell
set-option -g default-shell $SHELL

# env shell with 256 colors support
set -g default-terminal "$TERM"
# set -ag terminal-overrides ",*:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
# set -g default-terminal "screen-256color"
# set-window-option -g xterm-keys on

 # increase scroll-back history
set -g history-limit 5000

# use vi key bindings in copy mode
setw -g mode-keys vi      # use vim key bindings

# bring mouse scroll
set -g mouse on

# Forward pane focus changes to terminal applications like Neovim.
set -g focus-events on

# don't wait for esc/meta-key sequence
# set -sg escape-time 0
set -sg escape-time 1   # decrease command delay (increases vim responsiveness)
set -g repeat-time 1000 # increase repeat time for repeatable commands

# shift window numbers on each closed
set -g renumber-windows on  # renumber windows when a window is closed

# autorename windows
set-option -g status-interval 5
set-option -g automatic-rename on
setw -g automatic-rename on # rename window to reflect current program
set-option -g automatic-rename-format '#(basename "#{pane_current_path}")'

# longer messages display time
set -g display-panes-time 800
set -g display-time 1000

# activity
set -g monitor-activity off
set -g visual-activity off

# pbcopy | pbpaste
set-option -g default-command "reattach-to-user-namespace -l $SHELL"

# current path in new panes
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

###########################
#  Key Bindings
###########################
# y and p as in vim
# https://github.com/tmux/tmux/issues/754#issuecomment-297452143
# bind-key -T edit-mode-vi Up send-keys -X history-up
# bind-key -T edit-mode-vi Down send-keys -X history-down
# unbind-key -T copy-mode-vi Space     ;   bind-key -T copy-mode-vi v send-keys -X begin-selection
# unbind-key -T copy-mode-vi Enter     ;   bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# unbind-key -T copy-mode-vi C-v       ;   bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# unbind-key -T copy-mode-vi [         ;   bind-key -T copy-mode-vi [ send-keys -X begin-selection
# unbind-key -T copy-mode-vi ]         ;   bind-key -T copy-mode-vi ] send-keys -X copy-selection
# unbind-key -T copy-mode g
# unbind-key -T copy-mode-vi :

# vi bindings
set -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 4
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 4

###########################
#  Popups
###########################
# Ctrl+b ? - shortcuts
bind-key ? display-popup -E -w 62 -h 34 "title=\$(printf '\033[1;33m'); section=\$(printf '\033[1;36m'); key=\$(printf '\033[1m'); desc=\$(printf '\033[2m'); reset=\$(printf '\033[0m'); while IFS='|' read -r shortcut description; do case \"\$shortcut\" in TITLE) printf '%s%s%s\n' \"\$title\" \"\$description\" \"\$reset\" ;; SECTION) printf '\n%s%s%s\n' \"\$section\" \"\$description\" \"\$reset\" ;; '') ;; *) printf '  %s%-14s%s %s%s%s\n' \"\$key\" \"\$shortcut\" \"\$reset\" \"\$desc\" \"\$description\" \"\$reset\" ;; esac; done <<'TMUX_SHORTCUTS' | LESS= less -R
TITLE|TMUX SHORTCUTS
SECTION|Windows / Sessions
ctrl+b c|new window in current path
ctrl+b ,|rename current window
ctrl+b w|choose window
ctrl+b n/p|next/previous window
ctrl+b l|last active window
SECTION|Panes
ctrl+b \"|split top/bottom
ctrl+b %|split left/right
ctrl+b h/j/k/l|navigate panes
ctrl+b H/J/K/L|resize panes
ctrl+b z|zoom pane
ctrl+b x|kill pane
SECTION|Popups
ctrl+b ?|show this help
ctrl+b T|shell
ctrl+b S|new session
ctrl+b M|htop
ctrl+b G|lazygit
ctrl+b g|Go scratch
ctrl+b R|install plugins and reload config
ctrl+b F|fzf tmux pane
ctrl+b f|open fzf files
SECTION|Copy / Other
ctrl+b [|copy mode
q|quit copy mode
TMUX_SHORTCUTS"

# Ctrl+b T - shell
bind-key T display-popup -w 80% -h 80% -E
# Ctrl+b S - new session
bind-key S display-popup -E -w 50% -h 20% -d "#{pane_current_path}" "printf 'New session name: ' && read session_name && if [ -n \"\$session_name\" ]; then tmux new-session -d -s \"\$session_name\" -c \"#{pane_current_path}\" \\; switch-client -t \"\$session_name\"; fi"
# Ctrl+b M - htop
bind-key M display-popup -w 80% -h 80% -E "htop"
# Ctrl+b G - lazygit
bind-key G display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
# Ctrl+b g - Go scratch file in nvim
bind-key g display-popup -w 80% -h 80% -E "zsh -lc 'for script in \"\$HOME/.bin/tmux-go-scratch\" \"\$HOME/blackholesun/dotxfiles/bin/tmux-go-scratch\"; do if [ -x \"\$script\" ]; then exec \"\$script\"; fi; done; printf \"tmux-go-scratch was not found. Press any key to close.\\n\" >&2; read -k 1 _ || true'"
# Ctrl+b R - install plugins and reload config
bind-key R display-popup -E -w 72% -h 60% "zsh -lc 'printf \"Installing tmux plugins...\\n\\n\"; if ~/.tmux/plugins/tpm/scripts/install_plugins.sh; then printf \"\\nReloading tmux config...\\n\"; if tmux source-file ~/.tmux.conf >/dev/null 2>&1; then printf \"\\nDone. Press any key to close.\\n\"; else printf \"\\nReload failed. Press any key to close.\\n\"; fi; else printf \"\\nInstall failed. Press any key to close.\\n\"; fi; read -k 1 _ || true'"
# Ctrl+b f - fzf files in the current pane path
bind-key f display-popup -d "#{pane_current_path}" -E -w 80% -h 80% "fzf"

###########################
#  Colors & Theme
###########################
if-shell -b '[ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" == "Dark" ]' { set -g @tmux-gruvbox "dark" }
if-shell -b '[ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" != "Dark" ]' { set -g @tmux-gruvbox "light" }

# Stable inactive pane dimming.
set -g @tmux-dim-pane-theme "auto"
set -g @tmux-dim-pane-active-style "fg=terminal,bg=terminal"
set -g @tmux-dim-pane-dark-style "fg=colour244,bg=colour235"
set -g @tmux-dim-pane-light-style "fg=colour245,bg=colour252"
set -g @tmux-dim-pane-active-border-style "fg=#d8a657"
set -g @tmux-dim-pane-border-style "fg=#555555"

# messages styling
set -g message-style bg=#d8a657,fg=#1d1d1d,bold
set -g message-command-style bg=#1d1d1d,fg=#d8a657,bold

# Theme adjustments
set -g @tmux-gruvbox-right-status-y '%I:%M %p'
set -g @tmux-gruvbox-right-status-z '#h '
set -g @tmux-gruvbox-right-status-x '#{nowplaying} | %d.%m.%Y'

###########################
# Plugings
###########################
# Supports `github_username/repo` or full git repo URLs
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'barlevalon/tmux-nowplaying'
set -g @plugin 'sfate/tmux-dim-pane'

# Initializes TMUX plugin manager.
run '~/.tmux/plugins/tpm/tpm'

# TPM binds Ctrl+b I by default; keep plugin install/reload on Ctrl+b R only.
unbind-key I

# Custom bindings that must win over plugin defaults.
# Ctrl+b F - tmux pane picker
bind-key F run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/pane.sh switch"
